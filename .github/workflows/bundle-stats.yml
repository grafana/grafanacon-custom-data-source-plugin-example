name: Bundle Stats

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read
  pull-requests: write
  actions: read

jobs:
  compare:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: grafana/plugin-actions/bundle-size@8eedc83764c0580ca9a30e20a2a50094fa3396a0 # main
